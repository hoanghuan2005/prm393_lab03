[project]
name = "why-i-buy-e2e-tests"
version = "0.1.0"
description = "Automated E2E tests for Why I Buy with Google ARTEMIS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
python_files = ["test_*.py"]
